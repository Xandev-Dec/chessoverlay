name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Tag rilis Stockfish yang dikompilasi. Ganti bila ingin versi lain (mis. sf_18).
  STOCKFISH_TAG: sf_17.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---- Stockfish untuk Android arm64 (dikompilasi dari sumber resmi dengan NDK) ----
      - name: Cache Stockfish binary
        id: sf-cache
        uses: actions/cache@v4
        with:
          path: libstockfish.so
          key: stockfish-android-armv8-${{ env.STOCKFISH_TAG }}

      - name: Build Stockfish (arm64)
        if: steps.sf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"

          git clone --depth 1 --branch "$STOCKFISH_TAG" https://github.com/official-stockfish/Stockfish.git sf-src
          cd sf-src/src
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          "$NDK_BIN/llvm-strip" stockfish
          cp stockfish "$GITHUB_WORKSPACE/libstockfish.so"

      - name: Put Stockfish into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp libstockfish.so app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -l app/src/main/jniLibs/arm64-v8a

      # ---- Build APK ----
      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-overlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
